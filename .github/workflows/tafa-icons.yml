name: Build TAFA PWA icons (one-time)
on:
  push:
    branches: [feat/tafa-pwa-icons]
    paths:
      - scripts/generate-tafa-icons.py
      - .github/workflows/tafa-icons.yml
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python scripts/generate-tafa-icons.py
      - name: Commit generated brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons public/apple-touch-icon.png public/favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m "assets: official TAFA PWA icons and monochrome Android badge"
            git push origin HEAD:feat/tafa-pwa-icons
          fi
