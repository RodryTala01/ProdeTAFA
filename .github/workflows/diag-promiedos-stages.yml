name: Read-only Promiedos stage diagnosis
on:
  push:
    branches: [fix/club-promiedos-notifications]
    paths:
      - scripts/diag-promiedos-stages.mjs
      - .github/workflows/diag-promiedos-stages.yml
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node scripts/diag-promiedos-stages.mjs
