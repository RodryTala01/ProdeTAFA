name: Promiedos connectivity spike
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha argentina (YYYY-MM-DD)'
        required: true
      fixture:
        description: 'ID público del partido'
        required: true
      expectedUtc:
        description: 'Referencia UTC oficial opcional (ISO 8601)'
        required: false
permissions:
  contents: read
jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify actual acquisition clock (read-only)
        run: node scripts/diagnose-promiedos-clock.mjs
        env:
          PROBE_DATE: ${{ inputs.date }}
          PROBE_FIXTURE: ${{ inputs.fixture }}
          PROBE_EXPECTED_UTC: ${{ inputs.expectedUtc }}
